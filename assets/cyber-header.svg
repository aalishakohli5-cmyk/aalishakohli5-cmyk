<svg width="1200" height="300" viewBox="0 0 1200 300"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- DARK GREEN GLASS BACKGROUND -->
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300">
      <stop stop-color="#020604"/>
      <stop offset="0.5" stop-color="#07140D"/>
      <stop offset="1" stop-color="#020604"/>
    </linearGradient>

    <!-- GLASS PANEL -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#163D27" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#0A1F14" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#07110C" stop-opacity="0.35"/>
    </linearGradient>

    <!-- NEON BORDER -->
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="300">
      <stop stop-color="#7CFF00"/>
      <stop offset="0.5" stop-color="#DFFF00"/>
      <stop offset="1" stop-color="#39FF14"/>
    </linearGradient>

    <!-- NAME GRADIENT -->
    <linearGradient id="nameGradient" x1="420" y1="0" x2="780" y2="0">
      <stop stop-color="#7CFF00"/>
      <stop offset="0.5" stop-color="#DFFF00"/>
      <stop offset="1" stop-color="#7CFF00"/>
    </linearGradient>

    <!-- NEON GLOW -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- GRID -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none"
            stroke="#7CFF00"
            stroke-opacity="0.035"/>
    </pattern>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1200" height="300" rx="28" fill="url(#background)"/>

  <rect width="1200" height="300" rx="28" fill="url(#grid)"/>


  <!-- GLASS PANEL -->

  <rect x="35" y="35"
        width="1130" height="230"
        rx="25"
        fill="url(#glass)"
        stroke="url(#border)"
        stroke-width="1.5"
        stroke-opacity="0.65"/>


  <!-- CYBER CORNERS -->

  <path d="M65 90V65H105"
        stroke="#DFFF00"
        stroke-width="3"/>

  <path d="M1095 65H1135V90"
        stroke="#7CFF00"
        stroke-width="3"/>

  <path d="M65 210V235H105"
        stroke="#7CFF00"
        stroke-width="3"/>

  <path d="M1095 235H1135V210"
        stroke="#DFFF00"
        stroke-width="3"/>


  <!-- SMALL DECORATIVE LINES -->

  <path d="M150 150H350"
        stroke="#7CFF00"
        stroke-opacity="0.25"/>

  <circle cx="365" cy="150" r="3"
          fill="#DFFF00"/>

  <path d="M850 150H1050"
        stroke="#7CFF00"
        stroke-opacity="0.25"/>

  <circle cx="835" cy="150" r="3"
          fill="#DFFF00"/>


  <!-- NAME -->

  <text x="600"
        y="172"
        text-anchor="middle"
        fill="url(#nameGradient)"
        font-family="monospace"
        font-size="72"
        font-weight="800"
        letter-spacing="6"
        filter="url(#glow)">
    AK_STAR1
  </text>


  <!-- TINY CYBER PARTICLES -->

  <circle cx="120" cy="110" r="2" fill="#7CFF00"/>
  <circle cx="1080" cy="195" r="2" fill="#DFFF00"/>

  <circle cx="180" cy="225" r="1.5"
          fill="#DFFF00" opacity="0.6"/>

  <circle cx="1020" cy="95" r="1.5"
          fill="#7CFF00" opacity="0.6"/>

</svg>
